name: Regenerate grayscale previews

on:
  push:
    branches:
      - feat/grayscale-icons

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/grayscale-icons

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate grayscale assets and previews
        run: npm run build

      - name: Commit generated assets
        run: |
          if git diff --quiet; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/icons preview
          git commit -m "chore: regenerate grayscale previews"
          git push
